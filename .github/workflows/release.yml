name: GitHub Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify tag matches package version
        run: node scripts/verify-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm ci
      - run: npm run package
      - name: Create draft release with VSIX
        run: gh release create "$RELEASE_TAG" artifacts/*.vsix --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
