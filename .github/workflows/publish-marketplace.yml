name: Publish to VS Code Marketplace
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.1.3
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: marketplace-publish
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate release and publisher
        run: node scripts/verify-release.mjs --marketplace
      - run: npm ci
      - run: npm run package
      - name: Publish built VSIX with Trusted Publishing
        run: npx --no-install vsce publish --oidc --packagePath artifacts/*.vsix
